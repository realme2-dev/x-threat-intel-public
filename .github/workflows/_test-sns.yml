name: SNS Crawler Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests atproto

      - name: Test Mastodon crawler (no auth)
        run: |
          python -c "
          from sns_crawler import MastodonCrawler
          c = MastodonCrawler()
          result = c.crawl_account('briankrebs', 'infosec.exchange', max_posts=3)
          print('meta:', result.meta)
          print('tweet count:', len(result.tweets))
          if result.tweets:
              t = result.tweets[0]
              print('sample keys:', list(t.keys()))
              print('sample text:', t['text'][:100])
              print('sample user:', t['user'])
              print('sample date:', t['date'])
              print('sample link:', t['link'])
          "

      - name: Test Bluesky crawler (login + account + search)
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python -c "
          import os
          from sns_crawler import BlueskyCrawler

          c = BlueskyCrawler()
          ok = c.login(os.environ['BLUESKY_IDENTIFIER'], os.environ['BLUESKY_APP_PASSWORD'])
          print('login ok:', ok)

          result = c.crawl_account('troyhunt.com', max_posts=3)
          print('account meta:', result.meta)
          print('account tweet count:', len(result.tweets))
          if result.tweets:
              t = result.tweets[0]
              print('sample keys:', list(t.keys()))
              print('sample text:', t['text'][:100])
              print('sample user:', t['user'])
              print('sample date:', t['date'])
              print('sample link:', t['link'])

          search_result = c.search_keyword('CVE', max_posts=3)
          print('search meta:', search_result.meta)
          print('search tweet count:', len(search_result.tweets))
          if search_result.tweets:
              print('search sample text:', search_result.tweets[0]['text'][:100])
          "
