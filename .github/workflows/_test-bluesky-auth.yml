name: Bluesky Auth Quick Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests atproto

      - name: Test Bluesky login only
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python -c "
          import os
          from sns_crawler import BlueskyCrawler

          identifier = os.environ['BLUESKY_IDENTIFIER']
          password = os.environ['BLUESKY_APP_PASSWORD']
          print('identifier length:', len(identifier))
          print('password length:', len(password))

          c = BlueskyCrawler()
          ok = c.login(identifier, password)
          print('login ok:', ok)

          if ok:
              result = c.crawl_account('troyhunt.com', max_posts=2)
              print('account tweet count:', len(result.tweets))
              search_result = c.search_keyword('CVE', max_posts=2)
              print('search tweet count:', len(search_result.tweets))
          "
