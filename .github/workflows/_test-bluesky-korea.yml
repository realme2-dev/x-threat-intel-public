name: Bluesky Korea Keyword Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests atproto

      - name: Test Korea-specific keyword search on Bluesky
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python -c "
          import os
          from sns_crawler import BlueskyCrawler

          c = BlueskyCrawler()
          ok = c.login(os.environ['BLUESKY_IDENTIFIER'], os.environ['BLUESKY_APP_PASSWORD'])
          print('login ok:', ok)

          keywords = ['Korea hacking', 'Lazarus Group', 'North Korea cyber', 'DDoS Korea', '한국 해킹']
          for kw in keywords:
              result = c.search_keyword(kw, max_posts=5)
              print(f'{kw!r}: {len(result.tweets)}건')
              for t in result.tweets[:2]:
                  print('  -', t['text'][:80])
          "
