name: X Threat Intel Crawler

on:
  schedule:
    - cron: '0 22 * * *'   # KST 07:00 (UTC 22:00 전날)
    - cron: '0 8 * * *'    # KST 17:00 (UTC 08:00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_BACKEND: "gemini"
          LLM_FALLBACK_ORDER: "groq,openai"
          ENABLE_LLM: "true"
          PYTHONUTF8: "1"
        run: |
          # 정상 실행은 9~17분 내외로 끝난다. 드물게 크롤링/전송 로직이 전부
          # 끝난 뒤에도 프로세스가 종료되지 않는 hang이 발생하는데(GIL을 놓지
          # 않는 네이티브 코드 안에서 멈추는 것으로 추정, Python 레벨 타이머로는
          # 감지·강제종료가 안 됨), timeout(1)으로 감싸 OS 시그널로 확실히 끊는다.
          # 리포트 JSON은 크롤링 로직상 hang 지점보다 먼저 이미 저장되어 있으므로,
          # 타임아웃으로 죽어도 뒤이은 HTML 생성/커밋 스텝은 그대로 진행 가능하다.
          timeout -k 30 1200 python main.py --llm --workers 3 || echo "::warning::크롤러가 타임아웃/오류로 종료됨(코드 $?) - 마지막으로 저장된 리포트로 계속 진행"

      - name: Generate HTML report
        run: |
          PYTHONUTF8=1 python generate_report_html.py

      - name: Commit crawled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git reset --soft origin/master
          git add data/_report_*.json docs/index.html
          git diff --cached --quiet && echo "변경 없음, 커밋 건너뜀" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC') 크롤링 결과"
          git push origin master

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
